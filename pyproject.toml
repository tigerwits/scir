[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scir"
version = "0.2.1"
description = "Symbolic Content IR: ground ordered trees with deterministic tooling."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
scir = "scir.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
