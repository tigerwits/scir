[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-content-ir"
dynamic = ["version"]
description = "Symbolic content trees with deterministic structural tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tigerwits"}]
keywords = ["scir", "symbolic", "agents", "intermediate-representation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tigerwits/scir"
Issues = "https://github.com/tigerwits/scir/issues"
Specification = "https://github.com/tigerwits/scir/blob/main/SPEC.md"

[project.scripts]
scir = "scir.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "scir.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scir = ["py.typed"]
