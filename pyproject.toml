[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scir"
version = "0.1.0"
description = "Symbolic Content IR: a tiny expression language for exchanging content between LLM agents."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
