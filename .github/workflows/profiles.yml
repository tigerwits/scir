name: Profile verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p "test_profile*.py" -v
      - run: python -m unittest discover -s tests -p "test_notation*.py" -v
      - run: python -m unittest discover -s tests -p "test_named_roles.py" -v
      - run: python -m unittest discover -s tests -p "test_structured.py" -v
      - run: python -m unittest discover -s tests -p "test_working*.py" -v
      - run: python -m unittest discover -s tests -p "test_selection*.py" -v
      - run: python -m unittest discover -s tests -p "test_delivery*.py" -v
      - run: python -m unittest discover -s tests -p "test_consumer_lifecycle.py" -v
      - run: python -m unittest discover -s tests -p "test_repository_delivery.py" -v
      - run: python -m unittest discover -s tests -p "test_change*.py" -v
      - run: python -m unittest discover -s tests -p "test_guarded_changes.py" -v
      - run: python -m unittest discover -s tests -p "test_review_impact.py" -v
      - run: python tools/check_profile_distribution.py
      - run: python spec/check.py
      - run: git diff --exit-code
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check fixed Lean model
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst --output "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe' "$RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          python tools/check_lean_model.py "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean"
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install . tiktoken==0.12.0
      - run: python tools/check_profile_laws.py
      - run: python tools/study_profiles.py --tokens --output .build/profile-evaluation
      - run: python tools/study_delivery.py --output .build/delivery-evaluation
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-evidence
          path: .build/profile-evaluation/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-evidence
          path: .build/delivery-evaluation/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
