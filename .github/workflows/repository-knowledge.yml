name: Repository knowledge portability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p "test_repository*.py" -v
      - run: python -m unittest discover -s tests -p "test_native_projection.py" -v
      - run: python spec/check.py
      - run: git diff --exit-code
