name: Apply verified migration tree once
on:
  push:
    branches: [migration/scir-owned-knowledge]
    paths: ['.github/migration/**', '.github/workflows/migrate-once.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'tigerwits/scir'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Decode and stage only the exact approved tree
        run: |
          command -v zstd
          python .github/migration/apply.py
          test "$(git write-tree)" = 5eeed6c8dfd9496d06e23df81ed3cacb378df18c
      - name: Validate staged sources before committing
        run: |
          python -m pip install build
          python -m build
          python -m pip install --no-deps dist/*.whl
          python spec/check.py
          python -m unittest discover -s tests -v
          python tools/check_profile_distribution.py
          git diff --exit-code
          test "$(git write-tree)" = 5eeed6c8dfd9496d06e23df81ed3cacb378df18c
      - name: Commit and fast-forward only the migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate repository knowledge to authoritative SCIR records' -m 'Exact locally reviewed tree 5eeed6c8dfd9496d06e23df81ed3cacb378df18c. Preserve native 1.0, independent examples and historical fixtures. Remove the one-use transport. Full tests and rebuilt distribution checks passed on this runner; no agent trials were performed.'
          git push origin HEAD:refs/heads/migration/scir-owned-knowledge
