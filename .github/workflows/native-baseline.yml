name: Historical native integrity
on:
  push:
    branches: [main]
    paths: ["tools/check_native_baseline.py", "tests/test_native_baseline.py", ".github/workflows/native-baseline.yml"]
  pull_request:
    paths: ["tools/check_native_baseline.py", "tests/test_native_baseline.py", ".github/workflows/native-baseline.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tigerwits/scir
          ref: 3ceeb1ea9ae2c0f52a1568a1f7b611469384571c
          path: native-baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python current/tools/check_native_baseline.py native-baseline
      - run: |
          git -C current diff --exit-code
          git -C native-baseline diff --exit-code
