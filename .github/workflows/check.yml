name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Retain exact reviewed inputs and distributions
        if: matrix.python == '3.13'
        run: |
          mkdir -p .build/review
          git archive --format=tar.gz HEAD > .build/review/source.tar.gz
          git rev-parse HEAD > .build/review/revision.txt
          git ls-tree -r HEAD > .build/review/tree.txt
          cp dist/* .build/review/
          sha256sum .build/review/* > .build/review/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: reviewed-source-and-distributions
          path: .build/review/
          retention-days: 14
      - run: python -m pip install --no-deps dist/*.whl
      - run: python spec/check.py
      - run: python -m unittest discover -s tests -v
      - name: Run larger property sample once
        if: matrix.python == '3.13'
        run: python tools/check_properties.py
      - name: Check maintainer deletion safeguards once
        if: matrix.python == '3.13'
        run: python -m unittest discover -s .github/maintenance -v
      - run: git diff --exit-code
