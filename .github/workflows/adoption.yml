name: Runnable adoption examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -p test_adoption_examples.py -v
      - name: Verify shipped sources outside the checkout
        shell: bash
        run: |
          mkdir -p .build
          outside=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$outside"
          cd "$outside"/symbolic_content_ir-*
          python skills/scir/scripts/working_example.py > "$GITHUB_WORKSPACE/.build/consumer.json"
          python tools/check_self_host.py > "$GITHUB_WORKSPACE/.build/self-host.json"
          python examples/consumer-lifecycle/run.py > "$GITHUB_WORKSPACE/.build/lifecycle.json"
      - name: Retain exact tested source and distributions
        run: |
          git diff --exit-code
          git rev-parse HEAD > .build/source-revision.txt
          git archive --format=tar.gz -o .build/source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-host-verified-source
          path: |
            .build/consumer.json
            .build/self-host.json
            .build/lifecycle.json
            .build/source-revision.txt
            .build/source.tar.gz
            dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
