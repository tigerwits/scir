name: Merged branch maintenance
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  prune:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/maintenance -v
      - name: Delete only the exact merged event tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          repository = os.environ['GITHUB_REPOSITORY']
          if not pr['merged'] or pr['head']['repo']['full_name'] != repository:
              raise SystemExit('Not a merged local branch')
          tool = runpy.run_path('.github/maintenance/prune_merged_branches.py')
          manifest = {'repository': repository, 'branches': {pr['head']['ref']: pr['head']['sha']}}
          print(json.dumps(tool['run'](Path.cwd(), manifest, apply=True)))
          PY
